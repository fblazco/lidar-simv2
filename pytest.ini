[pytest]
testpaths = tests
# El entorno ROS del sistema inyecta plugins de pytest ajenos al proyecto
# (vía PYTHONPATH); se desactivan para que la suite no dependa de ellos.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_flake8 -p no:ament_lint -p no:ament_pep257 -p no:ament_xmllint
